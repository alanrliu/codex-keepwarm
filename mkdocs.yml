site_name: codex-keepwarm
site_description: Keep the Codex CLI's 5-hour usage window rolling, so idle time burns windows instead of your working time.
site_url: https://alanrliu.github.io/codex-keepwarm/
repo_url: https://github.com/alanrliu/codex-keepwarm
repo_name: alanrliu/codex-keepwarm
edit_uri: ""

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light first and with no `media:` key, so day mode is the default for
    # everyone rather than following the visitor's OS preference.
    # `toggle.name` becomes the button's title attribute, which extra.css
    # renders as visible text beside the icon.
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Night mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Day mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow

# docs/requirements.txt is a build input, not a page — keep it out of the site.
exclude_docs: |
  requirements.txt

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Install: install.md
  - Reference: reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alanrliu/codex-keepwarm
      name: codex-keepwarm on GitHub

copyright: MIT licensed. A port of claude-keepwarm. An unofficial community tool, not affiliated with OpenAI.
